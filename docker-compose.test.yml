version: '3.8'

services:
  # PostgreSQL pour les tests
  postgres-test:
    image: postgres:16-alpine
    container_name: articonnect-postgres-test
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: articonnect_test
    ports:
      - "5433:5432"
    volumes:
      - postgres-test-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis pour les tests
  redis-test:
    image: redis:7-alpine
    container_name: articonnect-redis-test
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # MailHog pour tester les emails (interface web sur :8025)
  mailhog:
    image: mailhog/mailhog:latest
    container_name: articonnect-mailhog
    ports:
      - "1025:1025"  # SMTP
      - "8025:8025"  # Web UI
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8025"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  postgres-test-data:
    name: articonnect-postgres-test-data

networks:
  default:
    name: articonnect-test-network
