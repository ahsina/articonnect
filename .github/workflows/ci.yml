name: CI/CD Pipeline

on:
  push:
    branches: [main, develop, claude/**]
  pull_request:
    branches: [main, develop]

jobs:
  # ========================================
  # Backend Tests & Build
  # ========================================
  backend:
    name: Backend CI
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: articonnect
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: articonnect_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

      mongodb:
        image: mongo:7-jammy
        env:
          MONGO_INITDB_ROOT_USERNAME: articonnect
          MONGO_INITDB_ROOT_PASSWORD: test_password
          MONGO_INITDB_DATABASE: articonnect_test
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 27017:27017

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies (root)
        run: npm ci

      - name: Generate Prisma Client
        working-directory: ./backend/shared
        run: npx prisma generate

      - name: Run Prisma Migrations
        working-directory: ./backend/shared
        env:
          DATABASE_URL: postgresql://articonnect:test_password@localhost:5432/articonnect_test
        run: |
          if [ -d "prisma/migrations" ]; then
            npx prisma migrate deploy
          else
            echo "No migrations found, using db push instead"
            npx prisma db push --skip-generate
          fi

      - name: Lint Backend
        working-directory: ./backend/api-gateway
        run: npm run lint
        continue-on-error: true

      - name: Run Backend Tests
        working-directory: ./backend/api-gateway
        env:
          DATABASE_URL: postgresql://articonnect:test_password@localhost:5432/articonnect_test
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          MONGODB_URI: mongodb://articonnect:test_password@localhost:27017/articonnect_test?authSource=admin
          JWT_SECRET: test-jwt-secret-for-ci-cd-pipeline
          JWT_REFRESH_SECRET: test-refresh-secret-for-ci-cd
          NODE_ENV: test
        run: npm run test
        continue-on-error: true

      - name: Build Backend
        working-directory: ./backend/api-gateway
        run: npm run build

  # ========================================
  # Frontend Tests & Build
  # ========================================
  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies (root)
        run: npm ci

      - name: Lint Frontend
        working-directory: ./frontend
        run: npm run lint
        continue-on-error: true

      - name: Type Check
        working-directory: ./frontend
        run: npm run type-check
        continue-on-error: true

      - name: Run Frontend Tests
        working-directory: ./frontend
        run: npm run test
        continue-on-error: true

      - name: Build Frontend
        working-directory: ./frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3001
          NEXT_PUBLIC_SOCKET_URL: http://localhost:3001
        run: npm run build

  # ========================================
  # Security Audit
  # ========================================
  security:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies (root)
        run: npm ci

      - name: Audit Backend Dependencies
        working-directory: ./backend/api-gateway
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Audit Frontend Dependencies
        working-directory: ./frontend
        run: npm audit --audit-level=high
        continue-on-error: true

  # ========================================
  # Docker Build (optional)
  # ========================================
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        working-directory: ./backend/api-gateway
        run: docker build -t articonnect-backend:latest .
        continue-on-error: true

      - name: Build Frontend Docker Image
        working-directory: ./frontend
        run: docker build -t articonnect-frontend:latest .
        continue-on-error: true
