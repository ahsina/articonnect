;; PgBouncer configuration for ArtiConnect
;; This file configures database connection pooling

[databases]
;; Database connection string
;; Format: dbname = host=<host> port=<port> dbname=<dbname> user=<user>
;; The actual connection details should be configured via environment variables

;; Main database
articonnect = host=${DB_HOST:-postgres} port=${DB_PORT:-5432} dbname=${DB_NAME:-articonnect} user=${DB_USER:-articonnect}

;; Read replica (optional - comment out if not using replicas)
;; articonnect_ro = host=${DB_REPLICA_HOST:-postgres-replica} port=${DB_PORT:-5432} dbname=${DB_NAME:-articonnect} user=${DB_USER:-articonnect}

[pgbouncer]
;; Listening configuration
listen_addr = 0.0.0.0
listen_port = 6432
unix_socket_dir = /var/run/pgbouncer

;; Authentication
auth_type = md5
auth_file = /etc/pgbouncer/userlist.txt

;; Pool Mode
;; - session: Server is assigned to client until logout
;; - transaction: Server is released back to pool after transaction
;; - statement: Server is released after each statement (most aggressive)
pool_mode = transaction

;; Pool sizing
;; These should be tuned based on your workload and database limits

;; Default pool size for each user/database pair
default_pool_size = 20

;; Minimum pool size - keep this many connections ready
min_pool_size = 5

;; Reserve pool for urgent requests when pool is full
reserve_pool_size = 5
reserve_pool_timeout = 3

;; Maximum connections per database
max_db_connections = 100

;; Maximum connections per user
max_user_connections = 50

;; Maximum total client connections
max_client_conn = 1000

;; Timeouts
;; Server connection timeout
server_connect_timeout = 15

;; Server login timeout
server_login_retry = 1

;; Time before unused connections are closed
server_idle_timeout = 600

;; Time before unused clients are closed
client_idle_timeout = 300

;; Client login timeout
client_login_timeout = 60

;; Query timeout (0 = no limit)
query_timeout = 120

;; Wait time for available connection
query_wait_timeout = 30

;; Logging
logfile = /var/log/pgbouncer/pgbouncer.log
log_connections = 1
log_disconnections = 1
log_pooler_errors = 1
stats_period = 60

;; Verbose stats in log
verbose = 0

;; Admin console access
admin_users = admin
stats_users = stats, admin

;; Security
;; Maximum packet size
pkt_buf = 4096

;; Max length of SQL for logging (0 = unlimited)
max_packet_size = 2147483647

;; Allow prepared statements in transaction mode (requires PostgreSQL 14+)
;; Uncomment if using PostgreSQL 14+
;; max_prepared_statements = 100

;; TLS settings (uncomment to enable SSL)
;; server_tls_sslmode = require
;; server_tls_ca_file = /etc/pgbouncer/ca.crt
;; client_tls_sslmode = require
;; client_tls_key_file = /etc/pgbouncer/server.key
;; client_tls_cert_file = /etc/pgbouncer/server.crt

;; DNS settings
dns_max_ttl = 15
dns_zone_check_period = 0

;; For application_name tracking
application_name_add_host = 1
