# HAProxy Configuration for PostgreSQL Read Replica Load Balancing
# ArtiConnect Database Infrastructure

global
    maxconn 4096
    log stdout format raw local0
    stats socket /var/run/haproxy.sock mode 600 level admin
    stats timeout 30s

defaults
    log global
    mode tcp
    option tcplog
    option dontlognull
    timeout connect 10s
    timeout client 30m
    timeout server 30m
    timeout check 5s
    retries 3

# Stats page (accessible at http://localhost:8404/stats)
listen stats
    bind *:8404
    mode http
    stats enable
    stats uri /stats
    stats refresh 30s
    stats admin if LOCALHOST

# PostgreSQL Read Replicas (Load Balanced)
listen postgres-read
    bind *:5432
    mode tcp
    option pgsql-check user articonnect
    balance roundrobin
    default-server inter 3s fall 3 rise 2 on-marked-down shutdown-sessions

    # Replica servers
    server replica1 postgres-replica1:5432 check port 5432
    server replica2 postgres-replica2:5432 check port 5432

    # Fallback to primary if all replicas are down
    server primary postgres-primary:5432 check port 5432 backup

# PostgreSQL Primary (for monitoring/direct access)
listen postgres-primary
    bind *:5433
    mode tcp
    option pgsql-check user articonnect

    server primary postgres-primary:5432 check port 5432
