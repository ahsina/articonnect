# ─── Krafolt — krafolt.com (marketplace artisans) ───────────────
server {
    listen 80;
    server_name krafolt.com www.krafolt.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name krafolt.com www.krafolt.com;

    ssl_certificate     /etc/letsencrypt/live/krafolt.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/krafolt.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:krafoltSSL:10m;
    ssl_session_timeout 10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    client_max_body_size 25M;

    resolver 127.0.0.11 valid=10s ipv6=off;

    # API backend (préfixe /api retiré ; backend NestJS sans préfixe global)
    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://backend:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 60s;
    }

    # WebSocket (Socket.io)
    location /socket.io/ {
        proxy_pass http://backend:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 86400s;
    }

    # Fichiers uploadés (MinIO bucket public)
    location /files/ {
        rewrite ^/files/(.*)$ /articonnect/$1 break;
        proxy_pass http://minio:9000;
        proxy_set_header Host $host;
        proxy_hide_header X-Amz-Request-Id;
    }

    location = /health {
        proxy_pass http://backend:4000/health;
        access_log off;
    }

    # Frontend Next.js
    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }
}
