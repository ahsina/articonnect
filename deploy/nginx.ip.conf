# ArtiConnect — reverse proxy mono-origine pour déploiement IP:9443 (HTTPS auto-signé).
# Tout sert depuis une seule origine https://<IP>:9443 :
#   - /api/*      -> backend NestJS (préfixe /api retiré ; le backend sert à la racine)
#   - /socket.io/ -> backend (WebSocket)
#   - /health     -> backend health
#   - /           -> frontend Next.js
# Cela désambiguïse la collision /auth (pages front vs API backend).

upstream articonnect_backend {
    server backend:4000;
}
upstream articonnect_frontend {
    server frontend:3000;
}

# Limitation de débit basique
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    client_max_body_size 25m;

    # Sécurité de base
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # --- API backend : on retire le préfixe /api avant de proxifier ---
    location /api/ {
        limit_req zone=api_limit burst=40 nodelay;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://articonnect_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 60s;
    }

    # --- WebSocket (Socket.io) ---
    location /socket.io/ {
        proxy_pass http://articonnect_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # --- Health check backend ---
    location = /health {
        proxy_pass http://articonnect_backend/health;
        access_log off;
    }

    # --- Frontend Next.js (catch-all) ---
    location / {
        proxy_pass http://articonnect_frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }
}
