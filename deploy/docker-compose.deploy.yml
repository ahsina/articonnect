# ArtiConnect — stack de déploiement DÉMO isolée (HTTPS auto-signé sur IP:9443).
# Lancer depuis la racine du repo :
#   docker compose -f deploy/docker-compose.deploy.yml --env-file deploy/.env.deploy up -d
# Réseau/volumes/noms préfixés "articonnect-" pour cohabiter avec les autres stacks du serveur.

name: articonnect

services:
  postgres:
    image: postgres:15-alpine
    container_name: articonnect-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    # Exposé uniquement en local (127.0.0.1) pour lancer `prisma db push`/seed depuis l'hôte.
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - articonnect_pg:/var/lib/postgresql/data
    networks: [articonnect]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: articonnect-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - articonnect_redis:/data
    networks: [articonnect]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: articonnect-backend:demo
    container_name: articonnect-backend
    restart: unless-stopped
    build:
      context: ..
      dockerfile: backend/api-gateway/Dockerfile
    env_file: [.env.deploy]
    networks: [articonnect]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:4000/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  frontend:
    image: articonnect-frontend:demo
    container_name: articonnect-frontend
    restart: unless-stopped
    build:
      context: ..
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_SOCKET_URL: ${NEXT_PUBLIC_SOCKET_URL}
        NEXT_PUBLIC_STRIPE_PUBLIC_KEY: ${NEXT_PUBLIC_STRIPE_PUBLIC_KEY}
    environment:
      NODE_ENV: production
      PORT: "3000"
    networks: [articonnect]
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    container_name: articonnect-nginx
    restart: unless-stopped
    ports:
      - "9443:443"
    volumes:
      - ./nginx.ip.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    networks: [articonnect]
    depends_on:
      - frontend
      - backend

networks:
  articonnect:
    name: articonnect-net

volumes:
  articonnect_pg:
    name: articonnect_pg
  articonnect_redis:
    name: articonnect_redis
